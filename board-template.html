<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creative Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1f; color: #e8e8ec; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(180deg, #0f0f12 0%, #1a1a1f 100%);
    border-bottom: 1px solid #2a2a30;
    padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .topbar h1 .accent { color: #f2913d; }
  .topbar .meta { font-size: 13px; color: #888; max-width: 60ch; }
  .topbar .meta strong { color: #ccc; }
  .controls { display: flex; gap: 8px; align-items: center; position: relative; }
  .controls input {
    background: #2a2a30; color: #e8e8ec; border: 1px solid #3a3a42;
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 220px;
  }
  .controls input::placeholder { color: #777; }
  .controls button {
    background: #2a2a30; color: #e8e8ec; border: 1px solid #3a3a42;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: background 0.15s;
  }
  .controls button:hover { background: #3a3a42; }
  .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
  .selection-badge {
    display: none;
    background: #f2913d; color: #1a1a1f; border: none;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .selection-badge:hover { background: #ffa552; }
  .selection-panel {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0;
    background: #232328; border: 1px solid #3a3a42; border-radius: 8px;
    padding: 14px; width: 260px; max-height: 320px; overflow-y: auto;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 200;
  }
  .selection-panel.active { display: block; }
  .selection-panel ul { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13px; }
  .selection-panel li { padding: 4px 0; border-bottom: 1px solid #2a2a30; word-break: break-word; }
  .selection-panel .panel-actions { display: flex; gap: 8px; }
  .selection-panel .panel-actions button {
    flex: 1; background: #2a2a30; color: #e8e8ec; border: 1px solid #3a3a42;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .selection-panel .panel-actions button:hover { background: #3a3a42; }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 28px;
    max-width: 1800px; margin: 0 auto;
  }
  .card {
    background: #232328;
    border: 1px solid #2f2f36;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    display: flex; flex-direction: column;
    cursor: pointer; position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #f2913d;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .card.selected {
    border-color: #f2913d;
    box-shadow: 0 0 0 2px #f2913d;
  }
  .card-header {
    padding: 10px 12px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px solid #2a2a30;
  }
  .img-wrap { background: #0e0e10; aspect-ratio: 9/16; position: relative; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .select-badge {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #f2913d; color: #1a1a1f;
    display: none; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  .card.selected .select-badge { display: flex; }
  .empty { padding: 60px 28px; text-align: center; color: #777; }
  .footer {
    padding: 30px 28px 50px; text-align: center; color: #666; font-size: 12px;
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>🎬 <span class="accent">Creative</span> Board</h1>
  <div class="meta"><strong id="countLabel">0 variations</strong> · generated __GENERATED_AT__<br>Source: <span id="rootPath"></span></div>
  <div class="controls">
    <input type="text" id="filterInput" placeholder="Filter by name..." oninput="renderBoard()">
    <button id="selectionBadge" class="selection-badge" onclick="toggleSelectionPanel(event)">✅ <span id="selCount">0</span> selected</button>
    <button id="saveBtn" onclick="saveBoard()">💾 Save</button>
    <div class="selection-panel" id="selectionPanel">
      <ul id="selectionListEl"></ul>
      <div class="panel-actions">
        <button onclick="copySelected()">📋 Copy</button>
        <button onclick="clearSelection()">Clear</button>
      </div>
    </div>
  </div>
</div>

<div class="board" id="board"></div>

<div class="footer">Click any card to select it. This file is fully self-contained — save or move it anywhere.</div>

<script>
  const CARDS = __CARDS_JSON__;
  const ROOT_PATH = __ROOT_PATH_JSON__;
  const selectedNames = new Set();

  document.getElementById('rootPath').textContent = ROOT_PATH;
  document.getElementById('countLabel').textContent = CARDS.length + (CARDS.length === 1 ? ' variation' : ' variations');

  function renderBoard() {
    const filter = document.getElementById('filterInput').value.trim().toLowerCase();
    const board = document.getElementById('board');
    board.innerHTML = '';

    const filtered = CARDS.filter(c => c.name.toLowerCase().includes(filter));
    if (filtered.length === 0) {
      board.innerHTML = '<div class="empty">No variations match that filter.</div>';
      return;
    }

    filtered.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (selectedNames.has(c.name) ? ' selected' : '');
      card.innerHTML = `
        <div class="card-header" title="${c.name}">${c.name}</div>
        <div class="img-wrap">
          <img src="${c.img}" alt="${c.name}" loading="lazy">
          <div class="select-badge">✓</div>
        </div>
      `;
      card.addEventListener('click', () => toggleSelect(c.name));
      board.appendChild(card);
    });
  }

  function toggleSelect(name) {
    if (selectedNames.has(name)) selectedNames.delete(name);
    else selectedNames.add(name);
    renderBoard();
    updateSelectionUI();
  }

  function updateSelectionUI() {
    const count = selectedNames.size;
    const badge = document.getElementById('selectionBadge');
    badge.innerHTML = '✅ <span id="selCount">' + count + '</span> selected';
    badge.style.display = count > 0 ? 'inline-block' : 'none';

    const listEl = document.getElementById('selectionListEl');
    listEl.innerHTML = '';
    [...selectedNames].sort().forEach(name => {
      const li = document.createElement('li');
      li.textContent = name;
      listEl.appendChild(li);
    });

    if (count === 0) {
      document.getElementById('selectionPanel').classList.remove('active');
    }
  }

  function toggleSelectionPanel(e) {
    e.stopPropagation();
    document.getElementById('selectionPanel').classList.toggle('active');
  }

  function clearSelection() {
    selectedNames.clear();
    renderBoard();
    updateSelectionUI();
  }

  function copySelected() {
    const names = [...selectedNames].sort();
    const text = names.length + ' selected\n' + names.join('\n');

    function showCopied() {
      const badge = document.getElementById('selectionBadge');
      badge.textContent = '✅ Copied!';
      setTimeout(updateSelectionUI, 1200);
    }

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) showCopied();
      else alert('Could not copy automatically. Selected:\n\n' + text);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  // Saves this entire page (including all embedded images) as a standalone .html file
  function saveBoard() {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'creative-board.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('selectionPanel').classList.remove('active');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.controls')) {
      document.getElementById('selectionPanel').classList.remove('active');
    }
  });

  renderBoard();
  updateSelectionUI();
</script>
</body>
</html>
